# AVADO Private Assistant: the only listener on the AVADO network (port 80,
# and port 443 once the box's *.my.ava.do certificate is there).
# Open WebUI, Ollama and the setup helper listen on 127.0.0.1 only.
user www-data;
worker_processes 2;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    # Redirects say only the path, so they also work behind another port.
    absolute_redirect off;
    sendfile on;
    # Documents people add to a chat
    client_max_body_size 200m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream webui {
        server 127.0.0.1:8080;
        keepalive 8;
    }

    # Any other name (an IP address, a look-alike name a web page made up to
    # reach the box): send the browser to the real address instead of answering.
    server {
        listen 80 default_server;
        server_name _;
        location / {
            return 302 http://assistant.my.ava.do$request_uri;
        }
    }

    server {
        listen 80;
        server_name assistant.my.ava.do localhost 127.0.0.1;
        # https://assistant.my.ava.do: written by avado-start (avadotls.py) once
        # the box's certificate is there; empty means http only.
        include /run/avado/https/https.conf;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;

        error_page 502 503 504 /avado-starting.html;
        location = /avado-starting.html {
            internal;
            root /opt/avado/nginx;
            add_header Cache-Control no-store always;
            add_header Retry-After 5 always;
        }

        # Until a model is on the box, the start page is the setup page.
        location = / {
            if (!-f /app/backend/data/avado/ready) {
                return 302 /avado/;
            }
            proxy_pass http://webui;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /avado {
            return 302 /avado/;
        }

        location /avado/ {
            proxy_pass http://127.0.0.1:8090;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        # "Explain this" for the AVADO Admin: the answer comes word by word (server-sent events) and
        # the helper stops it after 2 minutes.
        location = /avado/api/explain {
            proxy_pass http://127.0.0.1:8090;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 150s;
            client_max_body_size 16k;
        }

        location / {
            proxy_pass http://webui;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Answers stream word by word; on a processor a long answer takes minutes.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }
    }
}
